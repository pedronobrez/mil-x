# Builds the downloadable Windows and Linux artifacts, on Windows and on Linux.
#
# The macOS disk image is built locally by milx/scripts/package-release.sh, because a bundle
# needs codesign and iconutil. Everything else is built here for two reasons: the MSI cannot be
# built anywhere but Windows (WiX 5 validates directory names with Windows path rules and rejects
# every name on macOS), and a Windows runner is the only place this application has ever been
# started on Windows at all. That start is a step below, not a comment.
#
# Nothing here has the SCIEX Clearcore2 SDK, which is what makes these builds redistributable:
# vendor/sciex only exists on a machine where somebody accepted SCIEX's licence and fetched it.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the artifacts to (e.g. v0.9.0). Leave empty to only build."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read the version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' milx/Directory.Build.props | head -1)" >> "$GITHUB_OUTPUT"

      # The reader is compiled against SCIEX's SDK and shipped without it: the licence forbids
      # passing the assemblies on, so they are fetched here only to compile, and -p:ShipSciexSdk=false
      # keeps them out of everything this job publishes. A step below reads the archives back to
      # make sure of that.
      - name: Fetch the SCIEX SDK (to compile against, never to ship)
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip download alpharaw --no-deps --only-binary=:all: -d sdk
          wheel=$(ls sdk/alpharaw-*.whl | head -1)
          (cd sdk && unzip -q -o "$(basename "$wheel")" 'alpharaw/ext/sciex/*')
          mkdir -p milx/vendor/sciex
          cp sdk/alpharaw/ext/sciex/*.dll sdk/alpharaw/ext/sciex/*.txt milx/vendor/sciex/ 2>/dev/null || true
          ls milx/vendor/sciex | wc -l

      - name: Publish
        shell: bash
        run: |
          dotnet publish milx/src/MilX.Desktop/MilX.Desktop.csproj \
            -c Release -r win-x64 --self-contained \
            -p:UseOpenRawData=true -p:SkipLibraryDownload=true \
            -p:DebugType=None -p:DebugSymbols=false -p:ErrorOnDuplicatePublishOutputFiles=false \
            -p:ShipSciexSdk=false \
            -o publish/win-x64
          dotnet publish milx/src/MilX.Plugins.SciexWiff/MilX.Plugins.SciexWiff.csproj \
            -c Release -p:ShipSciexSdk=false -p:DebugType=None -p:DebugSymbols=false \
            -o publish/win-x64/plugins/sciex
          rm -f publish/win-x64/plugins/sciex/{Common,MilX.RawData,NCDK,MathNet.Numerics,Newtonsoft.Json,Splash}.dll publish/win-x64/plugins/sciex/{Accord,MessagePack}*.dll || true

      # The point of a Windows runner. The application writes what its window is showing to the
      # file named by MILX_UI_PROBE; if that file appears, Avalonia started, the window was
      # created and the view models are alive. Until this ran, "works on Windows" was a guess.
      - name: It starts on Windows
        shell: pwsh
        run: |
          $env:MILX_UI_PROBE = "$PWD\probe.json"
          $app = Start-Process -FilePath "publish\win-x64\MIL-X.exe" -PassThru
          for ($i = 0; $i -lt 60; $i++) {
            if ((Test-Path probe.json) -and (Get-Item probe.json).Length -gt 0) { break }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path probe.json) -or (Get-Item probe.json).Length -eq 0) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "the window never reported itself after 60s"
          }
          Write-Host "started in ${i}s; the window reports:"
          Get-Content probe.json -Raw | Select-Object -First 1
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

      - name: Stage
        shell: bash
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p "stage/MIL-X-$V-windows-x64"
          cp -R publish/win-x64/. "stage/MIL-X-$V-windows-x64/"
          cp LICENSE "stage/MIL-X-$V-windows-x64/LICENSE.txt"
          cp NOTICE  "stage/MIL-X-$V-windows-x64/NOTICE.txt"
          sed "s/@VERSION@/$V/g" milx/packaging/windows-README.txt > "stage/MIL-X-$V-windows-x64/README.txt"
          # SCIEX's redistributable components, chosen by the appendix of their own licence
          milx/scripts/carry-sciex.sh "stage/MIL-X-$V-windows-x64"
          # what travels must be named in Appendix A, and the licence must travel with it
          listed=$(sed -n '/APPENDIX A/,$p' milx/vendor/sciex/SCIEX_LICENSE.txt | sed -n 's/^[[:space:]]*\([A-Za-z0-9_.]*\.dll\)[[:space:]]*$/\1/p')
          for f in $(find stage -name "Clearcore2.*.dll" -o -name "Sciex*.dll" -o -name "SciexToolKit.dll"); do
            grep -qx "$(basename "$f")" <<< "$listed" || { echo "$f is not named in Appendix A" >&2; exit 1; }
          done
          test -f "$(find stage -name SCIEX_LICENSE.txt | head -1)" || { echo "the components must travel with their licence" >&2; exit 1; }

      - name: Zip
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage\MIL-X-$v-windows-x64" -DestinationPath "dist\MIL-X-$v-windows-x64.zip"

      - name: MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $v = "${{ steps.v.outputs.version }}"
          wix build milx/packaging/milx.wxs -d Version=$v `
            -d BundleDir="$PWD\stage\MIL-X-$v-windows-x64" `
            -d IconFile="$PWD\milx\packaging\icons\MIL-X.ico" `
            -o "dist\MIL-X-$v-windows-x64.msi"

      # The .milx association (and the .odproj one, for projects from before 1.0) is registry rows
      # inside the installer, and a typo in a key name fails silently: the MSI builds, installs, and
      # double clicking a project still does nothing. So the built database is queried for the rows
      # before it ships.
      - name: The project association is in the installer
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $msi = "$PWD\dist\MIL-X-$v-windows-x64.msi"
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @("SELECT ``Key``, ``Name``, ``Value`` FROM ``Registry``"))
          $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
          $rows = @()
          while ($true) {
            $rec = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
            if ($null -eq $rec) { break }
            $key   = $rec.GetType().InvokeMember("StringData", "GetProperty", $null, $rec, 1)
            $name  = $rec.GetType().InvokeMember("StringData", "GetProperty", $null, $rec, 2)
            $value = $rec.GetType().InvokeMember("StringData", "GetProperty", $null, $rec, 3)
            $rows += [pscustomobject]@{ Key = $key; Name = $name; Value = $value }
          }
          $rows | Where-Object { $_.Key -match "milx|odproj|MilX.Project|mdproject|Applications" } | Format-Table -AutoSize | Out-String | Write-Host
          $need = @("Software\\Classes\\.milx", "Software\\Classes\\.odproj\\OpenWithProgids", "MilX.Project\\shell\\open\\command", "MilX.Project\\DefaultIcon")
          foreach ($n in $need) {
            if (-not ($rows | Where-Object { $_.Key -match $n })) { throw "the installer has no $n row" }
          }
          $cmd = ($rows | Where-Object { $_.Key -match "MilX.Project\\shell\\open\\command" }).Value
          if ($cmd -notmatch 'MIL-X\.exe" "%1"') { throw "the open command does not pass the file: $cmd" }
          Write-Host "association ok: $cmd"

      # WiX treats a glob that matches nothing as success and writes a tiny installer. Every build
      # here carries a .NET runtime and Avalonia; anything under 30 MB is an empty one.
      - name: The installer is not empty
        shell: bash
        run: |
          for f in dist/*.msi dist/*.zip; do
            size=$(wc -c < "$f")
            echo "$f $size bytes"
            [ "$size" -gt 31457280 ] || { echo "$f is too small to hold an application" >&2; exit 1; }
          done

      # the .wixpdb is WiX's debug database: useful next to the build, noise on a release page
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.msi
            dist/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read the version
        id: v
        run: echo "version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' milx/Directory.Build.props | head -1)" >> "$GITHUB_OUTPUT"

      # The reader is compiled against SCIEX's SDK and shipped without it: the licence forbids
      # passing the assemblies on, so they are fetched here only to compile, and -p:ShipSciexSdk=false
      # keeps them out of everything this job publishes. A step below reads the archives back to
      # make sure of that.
      - name: Fetch the SCIEX SDK (to compile against, never to ship)
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip download alpharaw --no-deps --only-binary=:all: -d sdk
          wheel=$(ls sdk/alpharaw-*.whl | head -1)
          (cd sdk && unzip -q -o "$(basename "$wheel")" 'alpharaw/ext/sciex/*')
          mkdir -p milx/vendor/sciex
          cp sdk/alpharaw/ext/sciex/*.dll sdk/alpharaw/ext/sciex/*.txt milx/vendor/sciex/ 2>/dev/null || true
          ls milx/vendor/sciex | wc -l

      - name: Publish
        run: |
          dotnet publish milx/src/MilX.Desktop/MilX.Desktop.csproj \
            -c Release -r linux-x64 --self-contained \
            -p:UseOpenRawData=true -p:SkipLibraryDownload=true \
            -p:DebugType=None -p:DebugSymbols=false -p:ErrorOnDuplicatePublishOutputFiles=false \
            -p:ShipSciexSdk=false \
            -o publish/linux-x64
          dotnet publish milx/src/MilX.Plugins.SciexWiff/MilX.Plugins.SciexWiff.csproj \
            -c Release -p:ShipSciexSdk=false -p:DebugType=None -p:DebugSymbols=false \
            -o publish/linux-x64/plugins/sciex
          rm -f publish/linux-x64/plugins/sciex/{Common,MilX.RawData,NCDK,MathNet.Numerics,Newtonsoft.Json,Splash}.dll publish/linux-x64/plugins/sciex/{Accord,MessagePack}*.dll || true

      - name: It starts on Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx11-6 libice6 libsm6 libfontconfig1
          chmod +x publish/linux-x64/MIL-X
          export MILX_UI_PROBE="$PWD/probe.json"
          xvfb-run -a --server-args="-screen 0 1600x1000x24" publish/linux-x64/MIL-X &
          for i in $(seq 1 60); do [ -s probe.json ] && break; sleep 1; done
          [ -s probe.json ] || { echo "the window never reported itself after 60s" >&2; exit 1; }
          echo "started in ${i}s"
          head -c 200 probe.json

      - name: Tarball
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p "stage/MIL-X-$V-linux-x86_64" dist
          cp -R publish/linux-x64/. "stage/MIL-X-$V-linux-x86_64/"
          chmod +x "stage/MIL-X-$V-linux-x86_64/MIL-X"
          cp LICENSE "stage/MIL-X-$V-linux-x86_64/LICENSE.txt"
          cp NOTICE  "stage/MIL-X-$V-linux-x86_64/NOTICE.txt"
          sed "s/@VERSION@/$V/g" milx/packaging/linux-README.txt > "stage/MIL-X-$V-linux-x86_64/README.txt"
          # SCIEX's redistributable components, chosen by the appendix of their own licence
          milx/scripts/carry-sciex.sh "stage/MIL-X-$V-linux-x86_64"
          listed=$(sed -n '/APPENDIX A/,$p' milx/vendor/sciex/SCIEX_LICENSE.txt | sed -n 's/^[[:space:]]*\([A-Za-z0-9_.]*\.dll\)[[:space:]]*$/\1/p')
          for f in $(find stage -name "Clearcore2.*.dll" -o -name "Sciex*.dll" -o -name "SciexToolKit.dll"); do
            grep -qx "$(basename "$f")" <<< "$listed" || { echo "$f is not named in Appendix A" >&2; exit 1; }
          done
          test -f "$(find stage -name SCIEX_LICENSE.txt | head -1)" || { echo "the components must travel with their licence" >&2; exit 1; }
          tar -czf "dist/MIL-X-$V-linux-x86_64.tar.gz" -C stage "MIL-X-$V-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # A native arm64 runner, so the build is not cross-compiled and the start test is real. An
  # emulated arm64 container on an x86 host takes tens of minutes to do the same thing worse.
  linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read the version
        id: v
        run: echo "version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' milx/Directory.Build.props | head -1)" >> "$GITHUB_OUTPUT"

      # The reader is compiled against SCIEX's SDK and shipped without it: the licence forbids
      # passing the assemblies on, so they are fetched here only to compile, and -p:ShipSciexSdk=false
      # keeps them out of everything this job publishes. A step below reads the archives back to
      # make sure of that.
      - name: Fetch the SCIEX SDK (to compile against, never to ship)
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip download alpharaw --no-deps --only-binary=:all: -d sdk
          wheel=$(ls sdk/alpharaw-*.whl | head -1)
          (cd sdk && unzip -q -o "$(basename "$wheel")" 'alpharaw/ext/sciex/*')
          mkdir -p milx/vendor/sciex
          cp sdk/alpharaw/ext/sciex/*.dll sdk/alpharaw/ext/sciex/*.txt milx/vendor/sciex/ 2>/dev/null || true
          ls milx/vendor/sciex | wc -l

      - name: Publish
        run: |
          dotnet publish milx/src/MilX.Desktop/MilX.Desktop.csproj \
            -c Release -r linux-arm64 --self-contained \
            -p:UseOpenRawData=true -p:SkipLibraryDownload=true \
            -p:DebugType=None -p:DebugSymbols=false -p:ErrorOnDuplicatePublishOutputFiles=false \
            -p:ShipSciexSdk=false \
            -o publish/linux-arm64
          dotnet publish milx/src/MilX.Plugins.SciexWiff/MilX.Plugins.SciexWiff.csproj \
            -c Release -p:ShipSciexSdk=false -p:DebugType=None -p:DebugSymbols=false \
            -o publish/linux-arm64/plugins/sciex
          rm -f publish/linux-arm64/plugins/sciex/{Common,MilX.RawData,NCDK,MathNet.Numerics,Newtonsoft.Json,Splash}.dll publish/linux-arm64/plugins/sciex/{Accord,MessagePack}*.dll || true

      - name: It starts on Linux arm64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx11-6 libice6 libsm6 libfontconfig1
          chmod +x publish/linux-arm64/MIL-X
          export MILX_UI_PROBE="$PWD/probe.json"
          xvfb-run -a --server-args="-screen 0 1600x1000x24" publish/linux-arm64/MIL-X &
          for i in $(seq 1 60); do [ -s probe.json ] && break; sleep 1; done
          [ -s probe.json ] || { echo "the window never reported itself after 60s" >&2; exit 1; }
          echo "started in ${i}s"
          head -c 200 probe.json

      - name: Tarball
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p "stage/MIL-X-$V-linux-arm64" dist
          cp -R publish/linux-arm64/. "stage/MIL-X-$V-linux-arm64/"
          chmod +x "stage/MIL-X-$V-linux-arm64/MIL-X"
          cp LICENSE "stage/MIL-X-$V-linux-arm64/LICENSE.txt"
          cp NOTICE  "stage/MIL-X-$V-linux-arm64/NOTICE.txt"
          sed "s/@VERSION@/$V/g" milx/packaging/linux-README.txt > "stage/MIL-X-$V-linux-arm64/README.txt"
          # SCIEX's redistributable components, chosen by the appendix of their own licence
          milx/scripts/carry-sciex.sh "stage/MIL-X-$V-linux-arm64"
          listed=$(sed -n '/APPENDIX A/,$p' milx/vendor/sciex/SCIEX_LICENSE.txt | sed -n 's/^[[:space:]]*\([A-Za-z0-9_.]*\.dll\)[[:space:]]*$/\1/p')
          for f in $(find stage -name "Clearcore2.*.dll" -o -name "Sciex*.dll" -o -name "SciexToolKit.dll"); do
            grep -qx "$(basename "$f")" <<< "$listed" || { echo "$f is not named in Appendix A" >&2; exit 1; }
          done
          test -f "$(find stage -name SCIEX_LICENSE.txt | head -1)" || { echo "the components must travel with their licence" >&2; exit 1; }
          tar -czf "dist/MIL-X-$V-linux-arm64.tar.gz" -C stage "MIL-X-$V-linux-arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm
          path: dist/*

  attach:
    needs: [windows, linux, linux-arm]
    # on a tag push there is no input at all, so the event decides; a manual run has to name the tag
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: in }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          find in -type f -print
          gh release upload "$TAG" $(find in -type f) --clobber --repo "${{ github.repository }}"
